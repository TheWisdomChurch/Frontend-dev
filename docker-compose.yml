name: wisdom-frontend-dev

services:
  frontend-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NPM_REGISTRY: https://registry.npmjs.org
    ports:
      - '${PORT:-2000}:2000'
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      HOSTNAME: 0.0.0.0
      PORT: '2000'
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_WEBPACK_USEPOLLING: '1'
      CHOKIDAR_INTERVAL: '1000'
      WATCHPACK_POLLING_INTERVAL: '1000'
      NEXT_TELEMETRY_DISABLED: '1'
      API_PROXY_TARGET: '${API_PROXY_TARGET:-https://api.wisdomchurchhq.org}'
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    working_dir: /app
    # The source tree is bind-mounted while node_modules lives in a persistent
    # volume. Sync it on startup so newly added packages are not hidden by an
    # older volume created by Portainer/Docker Compose.
    command: >-
      sh -c "npm install --ignore-scripts --no-audit --no-fund &&
      npm run dev -- --hostname 0.0.0.0 --port 2000"
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:2000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NPM_REGISTRY: https://registry.npmjs.org
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-}'
        NEXT_PUBLIC_BACKEND_URL: '${NEXT_PUBLIC_BACKEND_URL:-}'
    restart: unless-stopped
    ports:
      - '${PORT:-2000}:2000'
    environment:
      NODE_ENV: production
      PORT: '2000'
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
      API_PROXY_TARGET: '${API_PROXY_TARGET:-https://api.wisdomchurchhq.org}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:2000', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  frontend_next:
