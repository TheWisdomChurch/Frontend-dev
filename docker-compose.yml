name: wisdom-frontend-dev

services:
  frontend-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NPM_REGISTRY: https://registry.npmjs.org
    ports:
      - '${PORT:-2000}:2000'
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      HOSTNAME: 0.0.0.0
      PORT: '2000'
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      NEXT_WEBPACK_USEPOLLING: '1'
      CHOKIDAR_INTERVAL: '1000'
      WATCHPACK_POLLING_INTERVAL: '1000'
      NEXT_TELEMETRY_DISABLED: '1'
      API_PROXY_TARGET: '${API_PROXY_TARGET:-https://api.wisdomchurchhq.org}'
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    working_dir: /app
    # The source tree is bind-mounted (often read-only under Portainer / remote
    # Docker hosts) while node_modules lives in a persistent named volume that is
    # seeded from the image build. On startup, top up any packages added since
    # the volume was created — but never write to the bind-mounted source tree:
    # `--no-package-lock` / `--no-save` keep npm off `/app/package-lock.json` and
    # `/app/package.json`, and the step is non-fatal so a read-only mount or an
    # offline registry can't block the dev server.
    command: >-
      sh -c "npm install --no-package-lock --no-save --ignore-scripts --no-audit --no-fund --prefer-offline || echo '[dev] skipping npm install — using node_modules from the image';
      exec npm run dev -- --hostname 0.0.0.0 --port 2000"
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:2000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-prod:
    profiles: ['prod']
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NPM_REGISTRY: https://registry.npmjs.org
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-}'
        NEXT_PUBLIC_BACKEND_URL: '${NEXT_PUBLIC_BACKEND_URL:-}'
    restart: unless-stopped
    ports:
      - '${PORT:-2000}:2000'
    environment:
      NODE_ENV: production
      PORT: '2000'
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
      API_PROXY_TARGET: '${API_PROXY_TARGET:-https://api.wisdomchurchhq.org}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:2000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
  frontend_next:
